<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gantt de Produção</title>
<style>
:root{--azul:#103273;--azul-claro:#eef1f8;--cinza:#6b7280;--borda:#dfe3ec;--vermelho:#b3261e;--bg:#f6f7fb;--grid:#edf0f6;--largura-nome:76px;--altura-linha:32px;--altura-dia:24px;--altura-hora:20px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1a1a2e}
header.topo{background:var(--azul);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap}
header.topo h1{font-size:1.2rem;margin:0;font-weight:700}
header.topo h1 span{font-weight:400;opacity:.85}
header.topo .direita{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
header.topo .stamp{font-size:.85rem;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
header.topo a,header.topo button{font:inherit;font-size:.85rem;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.5);padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none}
header.topo a:hover,header.topo button:hover{background:rgba(255,255,255,.12)}
header.topo button[disabled]{opacity:.6;cursor:wait}
main{padding:14px 16px 32px;display:grid;gap:12px}
.barra-acoes{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.tiles{display:inline-flex;flex-wrap:wrap;border:1px solid var(--azul);border-radius:8px;overflow:hidden}
.tiles button{font:inherit;font-size:.85rem;color:var(--azul);background:#fff;border:0;border-right:1px solid var(--azul);padding:6px 12px;cursor:pointer}
.tiles button:last-child{border-right:0}
.tiles button[aria-pressed="true"]{background:var(--azul);color:#fff}
.btn-sec{font:inherit;font-size:.85rem;color:var(--azul);background:#fff;border:1px solid var(--azul);border-radius:8px;padding:6px 12px;cursor:pointer}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--cinza);align-items:center}
.legenda .am{display:inline-flex;align-items:center;gap:6px}
.legenda .am i{width:16px;height:12px;border-radius:3px;display:inline-block;background:#9aa6c2}
.legenda .am.conc i{opacity:.5}
.legenda .am.dec i{box-shadow:0 0 0 2px #ffb300}
.aviso{padding:12px 16px;border-radius:8px;font-size:.92rem;background:#fff8e1;color:#7a5200;border:1px solid #f3dc9b}
.aviso.erro{background:#fdecea;color:var(--vermelho);border-color:#f5c2be}
[hidden]{display:none!important}

.gantt-wrap{display:flex;border:1px solid var(--borda);border-radius:10px;background:#fff;overflow:hidden;max-height:calc(100vh - 190px)}
.gantt-nomes{flex:0 0 var(--largura-nome);width:var(--largura-nome);overflow:hidden;border-right:2px solid var(--azul)}
.nomes-corpo{will-change:transform}
.gcell-nome{background:#fbfcff;color:var(--azul);font-weight:700;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--borda);height:var(--altura-linha);display:flex;align-items:center;box-sizing:border-box}
.gcell-nome:nth-child(even){background:#f3f5fb}
.gcell-nome.cabecalho{background:var(--azul-claro);height:calc(var(--altura-dia) + var(--altura-hora));border-bottom:1px solid var(--borda)}
.gantt-scroll{overflow:auto;flex:1 1 auto;min-width:0;position:relative}
.ghead{position:sticky;top:0;z-index:20;background:var(--azul-claro);border-bottom:1px solid var(--borda);height:calc(var(--altura-dia) + var(--altura-hora))}
.gtimeline-head{position:relative;height:100%}
.rotulo-dia,.rotulo-hora{position:absolute;top:0;font-size:.75rem;color:var(--azul);font-weight:700;border-left:1px solid #fff;padding:3px 6px;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.rotulo-dia{height:var(--altura-dia)}
.rotulo-hora{top:var(--altura-dia);height:var(--altura-hora);font-weight:400;font-size:.72rem;color:var(--cinza);border-left:1px solid var(--borda)}
.rotulo-hora.agora-col{color:var(--vermelho);font-weight:700}

.gantt-conteudo{position:relative}
.glinhas{position:relative}
.grow{border-bottom:1px solid var(--borda)}
.gtimeline{position:relative;height:var(--altura-linha);
  background-image:
    repeating-linear-gradient(to right, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent var(--px-hora)),
    repeating-linear-gradient(to right, #d7dcea 0, #d7dcea 1px, transparent 1px, transparent var(--px-dia));
  background-position: var(--offset-dia) 0, var(--offset-dia) 0;
}
.linha-agora{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--vermelho);z-index:6;pointer-events:none}
.fecho-semana{position:absolute;top:calc(var(--altura-dia) + var(--altura-hora));bottom:0;z-index:1;pointer-events:none;
  background-image:repeating-linear-gradient(45deg, rgba(16,50,115,.10) 0, rgba(16,50,115,.10) 5px, transparent 5px, transparent 14px);
  border-left:1px dashed var(--borda);border-right:1px dashed var(--borda)}
.barra{position:absolute;z-index:2;top:3px;height:calc(var(--altura-linha) - 6px);border-radius:5px;border:1px solid rgba(0,0,0,.12);font-size:.74rem;line-height:calc(var(--altura-linha) - 6px);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;box-sizing:border-box}
.barra.concluido{opacity:.5}
.barra.a_decorrer{box-shadow:0 0 0 2px #ffb300,0 1px 3px rgba(0,0,0,.25);font-weight:700}
.barra.agendado{opacity:.92}
.barra.estimado{border-style:dashed;border-width:2px}
.sem-dados{padding:10px;color:var(--cinza);font-size:.88rem}
.foot{font-size:.8rem;color:var(--cinza);max-width:120ch;margin:0}
</style>
</head>
<body>

<header class="topo">
  <h1>Gantt de Produção <span>· Tinturaria de Fio e Tingimento</span></h1>
  <div class="direita">
    <span class="stamp" id="stamp"></span>
    <button id="refresh" type="button" title="Lê já o Orgatex">Atualizar agora</button>
    <a id="linkPortal" href="#" title="Voltar ao Portal de Aplicações">&larr; Portal</a>
  </div>
</header>

<main>
  <div class="aviso" id="aviso" role="status" hidden></div>

  <div class="barra-acoes">
    <div class="tiles" id="zoom"></div>
    <button id="irAgora" type="button" class="btn-sec">Ir para agora</button>
    <div class="legenda">
      <span class="am dec"><i></i> A decorrer agora</span>
      <span class="am"><i></i> Agendado</span>
      <span class="am conc"><i></i> Concluído</span>
      <span class="am"><i style="border:2px dashed #555;background:none"></i> ≈ sem hora real (estimado)</span>
      <span>Cor da barra ≈ cor do tingimento (aproximada, a partir da descrição no Orgatex).</span>
    </div>
  </div>

  <div class="gantt-wrap">
    <div class="gantt-nomes" id="nomesCol">
      <div class="gcell-nome cabecalho">Máquina</div>
      <div class="nomes-corpo" id="nomesCorpo"></div>
    </div>
    <div class="gantt-scroll" id="scroll"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.getElementById('linkPortal').href = location.protocol + '//' + location.hostname + ':5050';

const ZOOMS = [
  ['semana', 'Semana', 7],
  ['dias3', '3 dias', 20],
  ['dia', 'Dia', 44],
];
let zoomAtual = 'dias3';
let D = null;
let H0 = null, H1 = null;

function pxPorHora() { return ZOOMS.find((z) => z[0] === zoomAtual)[2]; }
function horasEntre(a, b) { return (b - a) / 3600000; }
function xDe(data, desde) { return horasEntre(desde, data) * pxPorHora(); }
function dh(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
}

// A fábrica para de sábado às 6h a segunda às 6h (confirmado nos dados do Orgatex). Devolve os
// intervalos [inicioMs, fimMs] de fecho que tocam a janela [desde, ate], para desenhar o padrão.
function intervalosFecho(desde, ate) {
  const out = [];
  const d = new Date(desde);
  d.setHours(6, 0, 0, 0);
  let diasAteSabado = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diasAteSabado);
  if (d.getTime() > +desde) d.setDate(d.getDate() - 7); // apanha um fecho que já tenha começado antes de "desde"
  while (d.getTime() < +ate) {
    const inicio = d.getTime();
    const fim = new Date(d); fim.setDate(fim.getDate() + 2); // segunda às 6h
    if (fim.getTime() > +desde) out.push([Math.max(inicio, +desde), Math.min(fim.getTime(), +ate)]);
    d.setDate(d.getDate() + 7);
  }
  return out;
}

function construirCabecalho(desde, ate, largura) {
  const head = document.createElement('div');
  head.className = 'ghead';

  const tl = document.createElement('div');
  tl.className = 'gtimeline-head';
  tl.style.width = largura + 'px';
  const agora = new Date();
  const px = pxPorHora();
  let cursor = new Date(desde);
  cursor.setMinutes(0, 0, 0);
  let diaAtual = null, xDiaIni = 0;
  function fecharDia(xFim) {
    if (diaAtual == null) return;
    const d = document.createElement('div');
    d.className = 'rotulo-dia';
    d.style.left = xDiaIni + 'px';
    d.style.width = Math.max(0, xFim - xDiaIni) + 'px';
    d.textContent = diaAtual;
    tl.appendChild(d);
  }
  while (cursor < ate) {
    const x = xDe(cursor, desde);
    const diaStr = cursor.toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: '2-digit' });
    if (diaStr !== diaAtual) { fecharDia(x); diaAtual = diaStr; xDiaIni = x; }
    const h = document.createElement('div');
    h.className = 'rotulo-hora';
    h.style.left = x + 'px';
    h.style.width = px + 'px';
    h.textContent = px >= 20 ? String(cursor.getHours()).padStart(2, '0') + 'h' : (cursor.getHours() % 6 === 0 ? String(cursor.getHours()).padStart(2, '0') + 'h' : '');
    if (cursor <= agora && agora < new Date(cursor.getTime() + 3600000)) h.classList.add('agora-col');
    tl.appendChild(h);
    cursor = new Date(cursor.getTime() + 3600000);
  }
  fecharDia(largura);
  head.appendChild(tl);
  return head;
}

function construirLinhas(desde, ate, largura) {
  const linhas = document.createElement('div');
  linhas.className = 'glinhas';
  const nomesCorpo = $('nomesCorpo');
  nomesCorpo.innerHTML = '';
  const porMaquina = new Map((D.maquinas || []).map((m) => [m, []]));
  for (const l of D.lotes || []) {
    if (!porMaquina.has(l.maquina)) porMaquina.set(l.maquina, []);
    porMaquina.get(l.maquina).push(l);
  }
  if (!porMaquina.size) {
    const div = document.createElement('div');
    div.className = 'sem-dados';
    div.textContent = 'Sem máquinas na base de dados.';
    linhas.appendChild(div);
    return linhas;
  }
  for (const [maquina, lotes] of porMaquina) {
    const nomeCel = document.createElement('div');
    nomeCel.className = 'gcell-nome';
    nomeCel.textContent = maquina;
    nomesCorpo.appendChild(nomeCel);

    const row = document.createElement('div');
    row.className = 'grow';

    const tl = document.createElement('div');
    tl.className = 'gtimeline';
    tl.style.width = largura + 'px';

    for (const l of lotes) {
      const ini = new Date(l.inicio), fim = new Date(l.fim);
      const x0 = Math.max(0, xDe(ini, desde));
      const x1 = Math.min(largura, xDe(fim, desde));
      if (x1 <= 0 || x0 >= largura) continue;
      const bar = document.createElement('div');
      bar.className = 'barra ' + l.estado + (l.estimado ? ' estimado' : '');
      bar.style.left = x0 + 'px';
      bar.style.width = Math.max(3, x1 - x0) + 'px';
      bar.style.background = l.corBarra;
      bar.style.color = l.corTexto || '#fff';
      const prefixo = l.estado === 'concluido' ? '✓ ' : l.estado === 'a_decorrer' ? '▶ ' : '';
      bar.textContent = prefixo + (l.estimado ? '≈ ' : '') + l.lote;
      bar.title = `${l.lote}\nMáquina: ${maquina}\nInício: ${dh(l.inicio)}${l.estimado ? ' (estimado)' : ''}\nFim previsto: ${dh(l.fim)}${l.estimado ? ' (estimado)' : ''}` +
        (l.artigo ? `\nArtigo: ${l.artigo}` : '') + (l.cor ? `\nCor: ${l.cor}` : '') + (l.cliente ? `\nCliente: ${l.cliente}` : '') +
        `\nEstado: ${l.estado === 'concluido' ? 'concluído' : l.estado === 'a_decorrer' ? 'a decorrer agora' : 'agendado'}` +
        (l.estimado ? '\n(este lote ainda não tem hora real no Orgatex — a duração é uma estimativa)' : '');
      tl.appendChild(bar);
    }

    row.appendChild(tl);
    linhas.appendChild(row);
  }
  return linhas;
}

function render() {
  if (!D) return;
  const agora = new Date();
  const inicios = (D.lotes || []).map((l) => +new Date(l.inicio));
  const fins = (D.lotes || []).map((l) => +new Date(l.fim));
  H0 = new Date(Math.min(agora.getTime(), inicios.length ? Math.min(...inicios) : agora.getTime()));
  H1 = new Date(Math.max(agora.getTime() + 3600000, fins.length ? Math.max(...fins) : agora.getTime()));
  H0.setMinutes(0, 0, 0);
  H1.setMinutes(0, 0, 0); H1.setHours(H1.getHours() + 1);
  const largura = horasEntre(H0, H1) * pxPorHora();

  const px = pxPorHora();
  const meiaNoite = new Date(H0);
  meiaNoite.setHours(0, 0, 0, 0);
  const scroll = $('scroll');
  scroll.style.setProperty('--px-hora', px + 'px');
  scroll.style.setProperty('--px-dia', (px * 24) + 'px');
  scroll.style.setProperty('--offset-dia', xDe(meiaNoite, H0) + 'px');

  scroll.innerHTML = '';
  const conteudo = document.createElement('div');
  conteudo.className = 'gantt-conteudo';
  conteudo.appendChild(construirCabecalho(H0, H1, largura));
  conteudo.appendChild(construirLinhas(H0, H1, largura));
  for (const [ini, fim] of intervalosFecho(H0, H1)) {
    const faixa = document.createElement('div');
    faixa.className = 'fecho-semana';
    faixa.style.left = xDe(new Date(ini), H0) + 'px';
    faixa.style.width = Math.max(0, xDe(new Date(fim), H0) - xDe(new Date(ini), H0)) + 'px';
    faixa.title = 'Fábrica fechada (sábado às 6h a segunda às 6h)';
    conteudo.appendChild(faixa);
  }
  const linhaAgora = document.createElement('div');
  linhaAgora.className = 'linha-agora';
  linhaAgora.style.left = xDe(agora, H0) + 'px';
  conteudo.appendChild(linhaAgora);
  scroll.appendChild(conteudo);
}

function irParaAgora() {
  const agora = new Date();
  const x = xDe(agora, H0);
  const el = $('scroll');
  el.scrollLeft = Math.max(0, x - el.clientWidth * 0.3);
}

function montarZoom() {
  $('zoom').innerHTML = ZOOMS.map(([k, t]) => `<button type="button" data-k="${k}" aria-pressed="${k === zoomAtual}">${t}</button>`).join('');
  $('zoom').onclick = (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    zoomAtual = b.dataset.k;
    [...$('zoom').children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
    irParaAgora();
  };
}

function mostrarErro(msg) {
  const a = $('aviso');
  a.textContent = msg;
  a.classList.add('erro');
  a.hidden = false;
}

async function carregar() {
  try {
    const r = await fetch('/api/gantt-orgatex', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Não foi possível ler os dados do Gantt.');
    D = j;
    $('stamp').innerHTML = `Atualizado <b>${esc(D.atualizado.replace('T', ' ').slice(0, 16))}</b>`;
    montarZoom();
    render();
    irParaAgora();
  } catch (e) {
    mostrarErro(e.message);
  }
}
$('scroll').addEventListener('scroll', () => {
  $('nomesCorpo').style.transform = 'translateY(-' + $('scroll').scrollTop + 'px)';
});
carregar();
$('irAgora').addEventListener('click', irParaAgora);
$('refresh').addEventListener('click', async (ev) => {
  const b = ev.currentTarget;
  b.disabled = true;
  b.textContent = 'A ler o Orgatex…';
  try {
    const r = await fetch('/api/gantt-orgatex/atualizar', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'A atualização falhou.');
    await carregar();
  } catch (e) {
    mostrarErro(e.message);
  } finally {
    b.disabled = false;
    b.textContent = 'Atualizar agora';
  }
});
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => D && render(), 150); });
setInterval(carregar, 3 * 60 * 1000);
</script>
</body>
</html>
